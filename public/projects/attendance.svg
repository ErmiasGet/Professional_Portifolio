<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1033"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Fingerprint icon -->
  <g transform="translate(400,175)" opacity="0.35">
    <!-- Outer rings -->
    <path d="M0,-80 C44,-80 80,-44 80,0 C80,44 44,80 0,80" stroke="url(#grad)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M0,-60 C33,-60 60,-33 60,0 C60,33 33,60 0,60" stroke="#8B5CF6" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M0,-40 C22,-40 40,-22 40,0 C40,22 22,40 0,40" stroke="#2DD4BF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Inner curves -->
    <path d="M-60,0 C-60,-33 -33,-60 0,-60" stroke="url(#grad)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M-45,0 C-45,-25 -25,-45 0,-45" stroke="#8B5CF6" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M-30,0 C-30,-17 -17,-30 0,-30" stroke="#2DD4BF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Center -->
    <circle cx="0" cy="0" r="8" fill="url(#grad)" opacity="0.5"/>
  </g>
  <!-- Scanning lines -->
  <g opacity="0.15">
    <line x1="280" y1="130" x2="280" y2="230" stroke="#2DD4BF" stroke-width="1"/>
    <line x1="320" y1="110" x2="320" y2="250" stroke="#2DD4BF" stroke-width="1"/>
    <line x1="480" y1="110" x2="480" y2="250" stroke="#2DD4BF" stroke-width="1"/>
    <line x1="520" y1="130" x2="520" y2="230" stroke="#2DD4BF" stroke-width="1"/>
  </g>
  <!-- Checkmarks -->
  <g transform="translate(200,130)" opacity="0.4">
    <circle cx="0" cy="0" r="16" fill="#22C55E" opacity="0.2"/>
    <path d="M-6,0 L-2,4 L6,-4" stroke="#22C55E" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(600,150)" opacity="0.4">
    <circle cx="0" cy="0" r="16" fill="#22C55E" opacity="0.2"/>
    <path d="M-6,0 L-2,4 L6,-4" stroke="#22C55E" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(620,220)" opacity="0.3">
    <circle cx="0" cy="0" r="16" fill="#22C55E" opacity="0.2"/>
    <path d="M-6,0 L-2,4 L6,-4" stroke="#22C55E" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Time display -->
  <g transform="translate(400,310)" opacity="0.3">
    <rect x="-50" y="-15" width="100" height="30" rx="6" fill="#1a1033" stroke="#8B5CF6" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="16" fill="#8B5CF6">09:42 AM</text>
  </g>
  <!-- Title -->
  <text x="400" y="350" text-anchor="middle" font-family="system-ui" font-weight="700" font-size="28" fill="white">Attendance Management</text>
  <text x="400" y="378" text-anchor="middle" font-family="system-ui" font-weight="400" font-size="15" fill="#A78BFA">Biometric Fingerprint System</text>
  <g font-family="system-ui" font-size="12" fill="#A78BFA">
    <rect x="290" y="395" width="100" height="24" rx="4" fill="#1a1033" stroke="#8B5CF6" stroke-width="0.5" opacity="0.5"/>
    <text x="340" y="411" text-anchor="middle">Frappe Framework</text>
    <rect x="400" y="395" width="60" height="24" rx="4" fill="#1a1033" stroke="#8B5CF6" stroke-width="0.5" opacity="0.5"/>
    <text x="430" y="411" text-anchor="middle">Python</text>
    <rect x="470" y="395" width="75" height="24" rx="4" fill="#1a1033" stroke="#8B5CF6" stroke-width="0.5" opacity="0.5"/>
    <text x="507" y="411" text-anchor="middle">MariaDB</text>
  </g>
</svg>
