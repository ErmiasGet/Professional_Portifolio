<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1033"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Grid dots -->
  <g fill="#8B5CF6" opacity="0.06">
    <circle cx="40" cy="40" r="2"/><circle cx="80" cy="40" r="2"/><circle cx="120" cy="40" r="2"/><circle cx="160" cy="40" r="2"/><circle cx="200" cy="40" r="2"/><circle cx="240" cy="40" r="2"/><circle cx="280" cy="40" r="2"/><circle cx="320" cy="40" r="2"/><circle cx="360" cy="40" r="2"/><circle cx="400" cy="40" r="2"/><circle cx="440" cy="40" r="2"/><circle cx="480" cy="40" r="2"/><circle cx="520" cy="40" r="2"/><circle cx="560" cy="40" r="2"/><circle cx="600" cy="40" r="2"/><circle cx="640" cy="40" r="2"/><circle cx="680" cy="40" r="2"/><circle cx="720" cy="40" r="2"/><circle cx="760" cy="40" r="2"/>
    <circle cx="40" cy="80" r="2"/><circle cx="80" cy="80" r="2"/><circle cx="120" cy="80" r="2"/><circle cx="160" cy="80" r="2"/><circle cx="200" cy="80" r="2"/><circle cx="240" cy="80" r="2"/><circle cx="280" cy="80" r="2"/><circle cx="320" cy="80" r="2"/><circle cx="360" cy="80" r="2"/><circle cx="400" cy="80" r="2"/><circle cx="440" cy="80" r="2"/><circle cx="480" cy="80" r="2"/><circle cx="520" cy="80" r="2"/><circle cx="560" cy="80" r="2"/><circle cx="600" cy="80" r="2"/><circle cx="640" cy="80" r="2"/><circle cx="680" cy="80" r="2"/><circle cx="720" cy="80" r="2"/><circle cx="760" cy="80" r="2"/>
  </g>
  <!-- Central medical cross -->
  <g transform="translate(400,180)">
    <rect x="-40" y="-70" width="80" height="140" rx="12" fill="url(#grad)" opacity="0.15"/>
    <rect x="-70" y="-40" width="140" height="80" rx="12" fill="url(#grad)" opacity="0.15"/>
    <rect x="-30" y="-55" width="60" height="110" rx="8" fill="url(#grad)" opacity="0.3"/>
    <rect x="-55" y="-30" width="110" height="60" rx="8" fill="url(#grad)" opacity="0.3"/>
  </g>
  <!-- Heartbeat line -->
  <path d="M80,200 L240,200 L270,160 L300,240 L330,120 L360,280 L390,180 L420,200 L560,200" stroke="url(#grad)" stroke-width="3" fill="none" opacity="0.6"/>
  <!-- Connected nodes -->
  <g opacity="0.4">
    <circle cx="150" cy="120" r="20" fill="none" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="150" y="125" text-anchor="middle" font-family="system-ui" font-size="14" fill="#8B5CF6">H</text>
    <line x1="170" y1="120" x2="260" y2="180" stroke="#8B5CF6" stroke-width="1" opacity="0.5"/>
    <circle cx="280" cy="200" r="20" fill="none" stroke="#2DD4BF" stroke-width="1.5"/>
    <text x="280" y="205" text-anchor="middle" font-family="system-ui" font-size="14" fill="#2DD4BF">D</text>
    <line x1="300" y1="200" x2="480" y2="120" stroke="#2DD4BF" stroke-width="1" opacity="0.5"/>
    <circle cx="500" cy="100" r="20" fill="none" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="500" y="105" text-anchor="middle" font-family="system-ui" font-size="14" fill="#8B5CF6">P</text>
    <line x1="500" y1="120" x2="560" y2="200" stroke="#8B5CF6" stroke-width="1" opacity="0.5"/>
    <circle cx="580" cy="220" r="20" fill="none" stroke="#2DD4BF" stroke-width="1.5"/>
    <text x="580" y="225" text-anchor="middle" font-family="system-ui" font-size="14" fill="#2DD4BF">R</text>
  </g>
  <!-- Title -->
  <text x="400" y="340" text-anchor="middle" font-family="system-ui" font-weight="700" font-size="32" fill="white">DiagnoConnect</text>
  <text x="400" y="375" text-anchor="middle" font-family="system-ui" font-weight="400" font-size="16" fill="#A78BFA">Multi-Tenant Healthcare SaaS Platform</text>
  <!-- Tech badges -->
  <g font-family="system-ui" font-size="12" fill="#A78BFA">
    <rect x="290" y="395" width="60" height="24" rx="4" fill="#1a1033" stroke="#8B5CF6" stroke-width="0.5" opacity="0.5"/>
    <text x="320" y="411" text-anchor="middle">React</text>
    <rect x="360" y="395" width="90" height="24" rx="4" fill="#1a1033" stroke="#8B5CF6" stroke-width="0.5" opacity="0.5"/>
    <text x="405" y="411" text-anchor="middle">Spring Boot</text>
    <rect x="460" y="395" width="75" height="24" rx="4" fill="#1a1033" stroke="#8B5CF6" stroke-width="0.5" opacity="0.5"/>
    <text x="497" y="411" text-anchor="middle">PostgreSQL</text>
  </g>
</svg>
