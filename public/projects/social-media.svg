<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1033"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- People network -->
  <g opacity="0.3">
    <!-- Central person -->
    <circle cx="400" cy="150" r="22" fill="url(#grad)" opacity="0.4"/>
    <circle cx="400" cy="142" r="8" fill="white" opacity="0.3"/>
    <ellipse cx="400" cy="160" rx="12" ry="8" fill="white" opacity="0.2"/>
    <!-- Left person -->
    <circle cx="280" cy="180" r="18" fill="#8B5CF6" opacity="0.3"/>
    <circle cx="280" cy="174" r="6" fill="white" opacity="0.2"/>
    <ellipse cx="280" cy="190" rx="10" ry="6" fill="white" opacity="0.15"/>
    <!-- Right person -->
    <circle cx="520" cy="180" r="18" fill="#2DD4BF" opacity="0.3"/>
    <circle cx="520" cy="174" r="6" fill="white" opacity="0.2"/>
    <ellipse cx="520" cy="190" rx="10" ry="6" fill="white" opacity="0.15"/>
    <!-- Far left -->
    <circle cx="180" cy="210" r="15" fill="#8B5CF6" opacity="0.2"/>
    <!-- Far right -->
    <circle cx="620" cy="210" r="15" fill="#2DD4BF" opacity="0.2"/>
    <!-- Connection lines -->
    <line x1="300" y1="180" x2="378" y2="155" stroke="#8B5CF6" stroke-width="1.5" opacity="0.3"/>
    <line x1="422" y1="155" x2="500" y2="180" stroke="#2DD4BF" stroke-width="1.5" opacity="0.3"/>
    <line x1="195" y1="210" x2="262" y2="185" stroke="#8B5CF6" stroke-width="1" opacity="0.2"/>
    <line x1="538" y1="185" x2="605" y2="210" stroke="#2DD4BF" stroke-width="1" opacity="0.2"/>
  </g>
  <!-- Chat bubbles -->
  <g opacity="0.3">
    <rect x="140" y="120" width="80" height="35" rx="12" fill="#8B5CF6" opacity="0.25"/>
    <rect x="155" y="132" width="50" height="4" rx="2" fill="white" opacity="0.3"/>
    <rect x="155" y="140" width="35" height="3" rx="1.5" fill="white" opacity="0.2"/>
    <polygon points="200,155 195,165 210,155" fill="#8B5CF6" opacity="0.25"/>
    <rect x="580" y="100" width="80" height="35" rx="12" fill="#2DD4BF" opacity="0.25"/>
    <rect x="595" y="112" width="50" height="4" rx="2" fill="white" opacity="0.3"/>
    <rect x="595" y="120" width="35" height="3" rx="1.5" fill="white" opacity="0.2"/>
    <polygon points="600,135 605,145 590,135" fill="#2DD4BF" opacity="0.25"/>
  </g>
  <!-- Like/Heart icons -->
  <g opacity="0.35">
    <path d="M350,100 C350,95 345,90 340,90 C335,90 330,95 330,100 C330,110 350,120 350,120 C350,120 370,110 370,100 C370,95 365,90 360,90 C355,90 350,95 350,100Z" fill="#EF4444" opacity="0.4"/>
    <text x="365" y="95" font-family="system-ui" font-size="14" fill="#EF4444" opacity="0.5">24</text>
  </g>
  <!-- Notification badge -->
  <g transform="translate(530,140)">
    <circle cx="0" cy="0" r="10" fill="#EF4444" opacity="0.5"/>
    <text x="0" y="4" text-anchor="middle" font-family="system-ui" font-size="10" fill="white" opacity="0.7">3</text>
  </g>
  <!-- Post card mockup -->
  <g opacity="0.2">
    <rect x="300" y="200" width="200" height="60" rx="8" fill="#1a1033" stroke="#8B5CF6" stroke-width="0.5"/>
    <rect x="312" y="212" width="30" height="30" rx="4" fill="#8B5CF6" opacity="0.3"/>
    <rect x="350" y="216" width="100" height="4" rx="2" fill="white" opacity="0.2"/>
    <rect x="350" y="226" width="70" height="3" rx="1.5" fill="white" opacity="0.15"/>
    <rect x="350" y="236" width="85" height="3" rx="1.5" fill="white" opacity="0.1"/>
  </g>
  <!-- Title -->
  <text x="400" y="330" text-anchor="middle" font-family="system-ui" font-weight="700" font-size="28" fill="white">Mini Social Media</text>
  <text x="400" y="358" text-anchor="middle" font-family="system-ui" font-weight="400" font-size="15" fill="#A78BFA">Social Networking Platform</text>
  <g font-family="system-ui" font-size="12" fill="#A78BFA">
    <rect x="290" y="385" width="60" height="24" rx="4" fill="#1a1033" stroke="#8B5CF6" stroke-width="0.5" opacity="0.5"/>
    <text x="320" y="401" text-anchor="middle">React</text>
    <rect x="360" y="385" width="80" height="24" rx="4" fill="#1a1033" stroke="#8B5CF6" stroke-width="0.5" opacity="0.5"/>
    <text x="400" y="401" text-anchor="middle">Node.js</text>
    <rect x="450" y="385" width="70" height="24" rx="4" fill="#1a1033" stroke="#8B5CF6" stroke-width="0.5" opacity="0.5"/>
    <text x="485" y="401" text-anchor="middle">MongoDB</text>
  </g>
</svg>
