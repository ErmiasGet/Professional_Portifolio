<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1033"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Graduation cap -->
  <g transform="translate(400,140)">
    <!-- Cap top -->
    <polygon points="0,-45 90,0 0,30 -90,0" fill="url(#grad)" opacity="0.35"/>
    <polygon points="0,-45 90,0 0,15 -90,0" fill="url(#grad)" opacity="0.5"/>
    <!-- Tassel -->
    <line x1="70" y1="0" x2="100" y2="40" stroke="#2DD4BF" stroke-width="2" opacity="0.6"/>
    <circle cx="100" cy="45" r="5" fill="#2DD4BF" opacity="0.6"/>
    <!-- Board -->
    <rect x="-90" y="0" width="180" height="8" rx="2" fill="white" opacity="0.15"/>
  </g>
  <!-- Gallery frames -->
  <g opacity="0.3">
    <!-- Frame 1 -->
    <rect x="120" y="180" width="100" height="80" rx="6" fill="none" stroke="#8B5CF6" stroke-width="1.5"/>
    <rect x="130" y="190" width="80" height="40" rx="3" fill="#8B5CF6" opacity="0.15"/>
    <circle cx="155" cy="210" r="8" fill="#8B5CF6" opacity="0.2"/>
    <rect x="130" y="240" width="50" height="4" rx="2" fill="white" opacity="0.15"/>
    <rect x="130" y="248" width="35" height="3" rx="1.5" fill="white" opacity="0.1"/>
    <!-- Frame 2 -->
    <rect x="240" y="160" width="100" height="80" rx="6" fill="none" stroke="#2DD4BF" stroke-width="1.5"/>
    <rect x="250" y="170" width="80" height="40" rx="3" fill="#2DD4BF" opacity="0.15"/>
    <polygon points="270,190 290,175 310,190" fill="#2DD4BF" opacity="0.2"/>
    <rect x="250" y="220" width="50" height="4" rx="2" fill="white" opacity="0.15"/>
    <rect x="250" y="228" width="35" height="3" rx="1.5" fill="white" opacity="0.1"/>
    <!-- Frame 3 -->
    <rect x="460" y="160" width="100" height="80" rx="6" fill="none" stroke="#8B5CF6" stroke-width="1.5"/>
    <rect x="470" y="170" width="80" height="40" rx="3" fill="#8B5CF6" opacity="0.15"/>
    <circle cx="510" cy="190" r="12" fill="#8B5CF6" opacity="0.15"/>
    <rect x="470" y="220" width="50" height="4" rx="2" fill="white" opacity="0.15"/>
    <rect x="470" y="228" width="35" height="3" rx="1.5" fill="white" opacity="0.1"/>
    <!-- Frame 4 -->
    <rect x="580" y="180" width="100" height="80" rx="6" fill="none" stroke="#2DD4BF" stroke-width="1.5"/>
    <rect x="590" y="190" width="80" height="40" rx="3" fill="#2DD4BF" opacity="0.15"/>
    <rect x="610" y="200" width="40" height="20" rx="2" fill="white" opacity="0.1"/>
    <rect x="590" y="240" width="50" height="4" rx="2" fill="white" opacity="0.15"/>
    <rect x="590" y="248" width="35" height="3" rx="1.5" fill="white" opacity="0.1"/>
  </g>
  <!-- Star accents -->
  <g fill="#8B5CF6" opacity="0.2">
    <polygon points="160,100 163,108 172,108 165,113 167,122 160,117 153,122 155,113 148,108 157,108"/>
    <polygon points="640,110 643,118 652,118 645,123 647,132 640,127 633,132 635,123 628,118 637,118"/>
  </g>
  <!-- Title -->
  <text x="400" y="330" text-anchor="middle" font-family="system-ui" font-weight="700" font-size="28" fill="white">Graduate Gallery</text>
  <text x="400" y="358" text-anchor="middle" font-family="system-ui" font-weight="400" font-size="15" fill="#A78BFA">Student Showcase Platform</text>
  <g font-family="system-ui" font-size="12" fill="#A78BFA">
    <rect x="290" y="385" width="60" height="24" rx="4" fill="#1a1033" stroke="#8B5CF6" stroke-width="0.5" opacity="0.5"/>
    <text x="320" y="401" text-anchor="middle">React</text>
    <rect x="360" y="385" width="80" height="24" rx="4" fill="#1a1033" stroke="#8B5CF6" stroke-width="0.5" opacity="0.5"/>
    <text x="400" y="401" text-anchor="middle">Node.js</text>
    <rect x="450" y="385" width="70" height="24" rx="4" fill="#1a1033" stroke="#8B5CF6" stroke-width="0.5" opacity="0.5"/>
    <text x="485" y="401" text-anchor="middle">MongoDB</text>
  </g>
</svg>
