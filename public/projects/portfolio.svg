<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1033"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Browser window -->
  <g transform="translate(400,170)">
    <!-- Window frame -->
    <rect x="-180" y="-80" width="360" height="220" rx="10" fill="#1a1033" stroke="#2A2A2E" stroke-width="1.5"/>
    <!-- Title bar -->
    <rect x="-180" y="-80" width="360" height="30" rx="10" fill="#2A2A2E"/>
    <rect x="-180" y="-60" width="360" height="10" fill="#2A2A2E"/>
    <!-- Window controls -->
    <circle cx="-164" cy="-65" r="5" fill="#EF4444" opacity="0.6"/>
    <circle cx="-148" cy="-65" r="5" fill="#F59E0B" opacity="0.6"/>
    <circle cx="-132" cy="-65" r="5" fill="#22C55E" opacity="0.6"/>
    <!-- URL bar -->
    <rect x="-120" y="-72" width="200" height="14" rx="4" fill="#0d1117" stroke="#2A2A2E" stroke-width="0.5"/>
    <text x="-115" y="-62" font-family="monospace" font-size="7" fill="#71717A">ermias-getahun.vercel.app</text>
    <!-- Code content -->
    <g font-family="monospace" font-size="9">
      <text x="-160" y="-30" fill="#8B5CF6">const</text>
      <text x="-125" y="-30" fill="#2DD4BF"> portfolio</text>
      <text x="-65" y="-30" fill="white"> = </text>
      <text x="-50" y="-30" fill="#F59E0B">{"{"}</text>
      <text x="-145" y="-15" fill="#71717A">  name:</text>
      <text x="-95" y="-15" fill="#22C55E"> "Ermias"</text>
      <text x="-40" y="-15" fill="#71717A">,</text>
      <text x="-145" y="0" fill="#71717A">  stack:</text>
      <text x="-90" y="0" fill="#22C55E"> ["Next.js"</text>
      <text x="-20" y="0" fill="#71717A">,</text>
      <text x="-145" y="15" fill="#71717A">         </text>
      <text x="-90" y="15" fill="#22C55E"> "React"</text>
      <text x="-40" y="15" fill="#71717A">,</text>
      <text x="-145" y="30" fill="#71717A">         </text>
      <text x="-90" y="30" fill="#22C55E"> "TS"]</text>
      <text x="-145" y="50" fill="#F59E0B">{"}"}</text>
    </g>
    <!-- Cursor blink -->
    <rect x="-38" y="-35" width="1" height="12" fill="white" opacity="0.5"/>
  </g>
  <!-- Floating elements -->
  <g opacity="0.25">
    <!-- Code bracket left -->
    <text x="120" y="120" font-family="monospace" font-size="48" fill="#8B5CF6">{"{"}</text>
    <!-- Code bracket right -->
    <text x="650" y="130" font-family="monospace" font-size="48" fill="#2DD4BF">{"}"}</text>
    <!-- Slash -->
    <text x="140" y="300" font-family="monospace" font-size="36" fill="#8B5CF6" opacity="0.5">/&gt;</text>
  </g>
  <!-- EG logo small -->
  <g transform="translate(400,330)">
    <rect x="-25" y="-15" width="50" height="30" rx="8" fill="url(#grad)" opacity="0.3"/>
    <text x="0" y="5" text-anchor="middle" font-family="system-ui" font-weight="800" font-size="14" fill="white" opacity="0.5">EG</text>
  </g>
  <!-- Title -->
  <text x="400" y="370" text-anchor="middle" font-family="system-ui" font-weight="700" font-size="28" fill="white">Personal Portfolio</text>
  <text x="400" y="398" text-anchor="middle" font-family="system-ui" font-weight="400" font-size="15" fill="#A78BFA">Modern Responsive Portfolio Website</text>
  <g font-family="system-ui" font-size="12" fill="#A78BFA">
    <rect x="290" y="415" width="65" height="24" rx="4" fill="#1a1033" stroke="#8B5CF6" stroke-width="0.5" opacity="0.5"/>
    <text x="322" y="431" text-anchor="middle">Next.js</text>
    <rect x="365" y="415" width="75" height="24" rx="4" fill="#1a1033" stroke="#8B5CF6" stroke-width="0.5" opacity="0.5"/>
    <text x="402" y="431" text-anchor="middle">TypeScript</text>
    <rect x="450" y="415" width="85" height="24" rx="4" fill="#1a1033" stroke="#8B5CF6" stroke-width="0.5" opacity="0.5"/>
    <text x="492" y="431" text-anchor="middle">Tailwind CSS</text>
  </g>
</svg>
