<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1033"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Folder stack -->
  <g transform="translate(400,160)">
    <!-- Back folder -->
    <rect x="-100" y="-60" width="200" height="130" rx="8" fill="#8B5CF6" opacity="0.12"/>
    <rect x="-100" y="-60" width="60" height="20" rx="4" fill="#8B5CF6" opacity="0.2"/>
    <!-- Middle folder -->
    <rect x="-80" y="-40" width="180" height="120" rx="8" fill="#8B5CF6" opacity="0.18"/>
    <rect x="-80" y="-40" width="50" height="18" rx="4" fill="#8B5CF6" opacity="0.25"/>
    <!-- Front folder -->
    <rect x="-60" y="-20" width="160" height="110" rx="8" fill="url(#grad)" opacity="0.25"/>
    <rect x="-60" y="-20" width="45" height="16" rx="4" fill="url(#grad)" opacity="0.35"/>
    <!-- Document lines inside -->
    <rect x="-40" y="10" width="80" height="6" rx="3" fill="white" opacity="0.3"/>
    <rect x="-40" y="26" width="60" height="6" rx="3" fill="white" opacity="0.2"/>
    <rect x="-40" y="42" width="100" height="6" rx="3" fill="white" opacity="0.15"/>
    <rect x="-40" y="58" width="70" height="6" rx="3" fill="white" opacity="0.1"/>
  </g>
  <!-- Floating documents -->
  <g opacity="0.3">
    <rect x="150" y="100" width="60" height="80" rx="6" fill="white" opacity="0.1"/>
    <rect x="158" y="112" width="44" height="4" rx="2" fill="#8B5CF6" opacity="0.4"/>
    <rect x="158" y="122" width="32" height="4" rx="2" fill="#8B5CF6" opacity="0.3"/>
    <rect x="158" y="132" width="40" height="4" rx="2" fill="#8B5CF6" opacity="0.2"/>
  </g>
  <g opacity="0.3">
    <rect x="590" y="80" width="60" height="80" rx="6" fill="white" opacity="0.1"/>
    <rect x="598" y="92" width="44" height="4" rx="2" fill="#2DD4BF" opacity="0.4"/>
    <rect x="598" y="102" width="32" height="4" rx="2" fill="#2DD4BF" opacity="0.3"/>
    <rect x="598" y="112" width="40" height="4" rx="2" fill="#2DD4BF" opacity="0.2"/>
  </g>
  <!-- Search icon -->
  <circle cx="580" cy="200" r="30" fill="none" stroke="#8B5CF6" stroke-width="2" opacity="0.3"/>
  <line x1="601" y1="221" x2="620" y2="240" stroke="#8B5CF6" stroke-width="2" opacity="0.3"/>
  <!-- Tags/labels -->
  <g opacity="0.25">
    <rect x="120" y="280" width="50" height="20" rx="4" fill="#8B5CF6"/>
    <rect x="180" y="280" width="60" height="20" rx="4" fill="#2DD4BF"/>
    <rect x="250" y="280" width="45" height="20" rx="4" fill="#8B5CF6"/>
  </g>
  <!-- Title -->
  <text x="400" y="340" text-anchor="middle" font-family="system-ui" font-weight="700" font-size="28" fill="white">Finance File Management</text>
  <text x="400" y="370" text-anchor="middle" font-family="system-ui" font-weight="400" font-size="15" fill="#A78BFA">Enterprise Document Management System</text>
  <g font-family="system-ui" font-size="12" fill="#A78BFA">
    <rect x="290" y="390" width="60" height="24" rx="4" fill="#1a1033" stroke="#8B5CF6" stroke-width="0.5" opacity="0.5"/>
    <text x="320" y="406" text-anchor="middle">React</text>
    <rect x="360" y="390" width="80" height="24" rx="4" fill="#1a1033" stroke="#8B5CF6" stroke-width="0.5" opacity="0.5"/>
    <text x="400" y="406" text-anchor="middle">Node.js</text>
    <rect x="450" y="390" width="75" height="24" rx="4" fill="#1a1033" stroke="#8B5CF6" stroke-width="0.5" opacity="0.5"/>
    <text x="487" y="406" text-anchor="middle">PostgreSQL</text>
  </g>
</svg>
