<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1033"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Medical cross -->
  <g transform="translate(400,150)" opacity="0.35">
    <rect x="-25" y="-50" width="50" height="100" rx="8" fill="url(#grad)" opacity="0.4"/>
    <rect x="-50" y="-25" width="100" height="50" rx="8" fill="url(#grad)" opacity="0.4"/>
  </g>
  <!-- SaaS cloud -->
  <g transform="translate(400,150)" opacity="0.2">
    <ellipse cx="0" cy="-80" rx="60" ry="25" fill="#8B5CF6" opacity="0.3"/>
    <ellipse cx="-30" cy="-70" rx="40" ry="20" fill="#8B5CF6" opacity="0.2"/>
    <ellipse cx="30" cy="-70" rx="40" ry="20" fill="#8B5CF6" opacity="0.2"/>
  </g>
  <!-- Connected facilities -->
  <g opacity="0.3">
    <!-- Hospital -->
    <rect x="100" y="110" width="50" height="40" rx="4" fill="#8B5CF6" opacity="0.2"/>
    <rect x="115" y="100" width="20" height="15" rx="2" fill="#8B5CF6" opacity="0.15"/>
    <text x="125" y="135" text-anchor="middle" font-family="system-ui" font-size="8" fill="#8B5CF6" opacity="0.6">Hospital</text>
    <!-- Clinic -->
    <rect x="250" y="100" width="40" height="35" rx="4" fill="#2DD4BF" opacity="0.2"/>
    <text x="270" y="122" text-anchor="middle" font-family="system-ui" font-size="8" fill="#2DD4BF" opacity="0.6">Clinic</text>
    <!-- Diagnostic -->
    <rect x="510" y="100" width="40" height="35" rx="4" fill="#2DD4BF" opacity="0.2"/>
    <text x="530" y="122" text-anchor="middle" font-family="system-ui" font-size="8" fill="#2DD4BF" opacity="0.6">Diagnostic</text>
    <!-- Pharmacy -->
    <rect x="650" y="110" width="50" height="40" rx="4" fill="#8B5CF6" opacity="0.2"/>
    <text x="675" y="135" text-anchor="middle" font-family="system-ui" font-size="8" fill="#8B5CF6" opacity="0.6">Pharmacy</text>
  </g>
  <!-- Connection lines -->
  <g stroke-width="1" stroke-dasharray="4 3" opacity="0.2">
    <line x1="150" y1="130" x2="370" y2="150" stroke="#8B5CF6"/>
    <line x1="290" y1="118" x2="370" y2="145" stroke="#2DD4BF"/>
    <line x1="430" y1="145" x2="510" y2="118" stroke="#2DD4BF"/>
    <line x1="430" y1="150" x2="650" y2="130" stroke="#8B5CF6"/>
  </g>
  <!-- Tech labels -->
  <g transform="translate(400,280)" opacity="0.2">
    <rect x="-120" y="-15" width="80" height="30" rx="6" fill="#1a1033" stroke="#8B5CF6" stroke-width="0.5"/>
    <text x="-80" y="5" text-anchor="middle" font-family="system-ui" font-size="11" fill="#8B5CF6">Spring Boot</text>
    <rect x="-30" y="-15" width="60" height="30" rx="6" fill="#1a1033" stroke="#2DD4BF" stroke-width="0.5"/>
    <text x="0" y="5" text-anchor="middle" font-family="system-ui" font-size="11" fill="#2DD4BF">React</text>
    <rect x="40" y="-15" width="80" height="30" rx="6" fill="#1a1033" stroke="#8B5CF6" stroke-width="0.5"/>
    <text x="80" y="5" text-anchor="middle" font-family="system-ui" font-size="11" fill="#8B5CF6">PostgreSQL</text>
  </g>
  <!-- Title -->
  <text x="400" y="340" text-anchor="middle" font-family="system-ui" font-weight="700" font-size="22" fill="white">Healthcare SaaS Platform</text>
  <text x="400" y="368" text-anchor="middle" font-family="system-ui" font-weight="400" font-size="13" fill="#A78BFA">Spring Boot &amp; React Multi-Tenant System</text>
</svg>
