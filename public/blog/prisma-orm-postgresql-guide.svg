<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1033"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Database cylinder -->
  <g transform="translate(400,150)" opacity="0.35">
    <ellipse cx="0" cy="-35" rx="55" ry="18" fill="url(#grad)" opacity="0.4"/>
    <rect x="-55" y="-35" width="110" height="70" fill="url(#grad)" opacity="0.2"/>
    <ellipse cx="0" cy="35" rx="55" ry="18" fill="url(#grad)" opacity="0.35"/>
    <ellipse cx="0" cy="-10" rx="55" ry="18" fill="none" stroke="white" stroke-width="0.5" opacity="0.15"/>
    <ellipse cx="0" cy="15" rx="55" ry="18" fill="none" stroke="white" stroke-width="0.5" opacity="0.15"/>
  </g>
  <!-- Prisma schema lines -->
  <g transform="translate(180,120)" opacity="0.3">
    <rect x="0" y="0" width="120" height="100" rx="6" fill="#1a1033" stroke="#8B5CF6" stroke-width="1"/>
    <text x="12" y="20" font-family="monospace" font-size="9" fill="#8B5CF6">model User {</text>
    <text x="12" y="35" font-family="monospace" font-size="8" fill="#2DD4BF">  id    Int</text>
    <text x="12" y="47" font-family="monospace" font-size="8" fill="#2DD4BF">  name  String</text>
    <text x="12" y="59" font-family="monospace" font-size="8" fill="#2DD4BF">  email String</text>
    <text x="12" y="71" font-family="monospace" font-size="8" fill="#2DD4BF">  posts Post[]</text>
    <text x="12" y="86" font-family="monospace" font-size="9" fill="#8B5CF6">}</text>
  </g>
  <!-- Type-safe query -->
  <g transform="translate(500,100)" opacity="0.25">
    <rect x="0" y="0" width="140" height="80" rx="6" fill="#1a1033" stroke="#2DD4BF" stroke-width="1"/>
    <text x="12" y="20" font-family="monospace" font-size="8" fill="#71717A">// Type-safe query</text>
    <text x="12" y="35" font-family="monospace" font-size="9" fill="#2DD4BF">const users =</text>
    <text x="12" y="48" font-family="monospace" font-size="9" fill="white">  await prisma</text>
    <text x="12" y="61" font-family="monospace" font-size="9" fill="white">  .user.findMany()</text>
  </g>
  <!-- PostgreSQL logo area -->
  <g transform="translate(400,270)" opacity="0.2">
    <rect x="-30" y="-12" width="60" height="24" rx="4" fill="#1a1033" stroke="#8B5CF6" stroke-width="0.5"/>
    <text x="0" y="4" text-anchor="middle" font-family="system-ui" font-size="10" fill="#8B5CF6">PostgreSQL</text>
  </g>
  <!-- Connection arrows -->
  <g stroke-width="1.5" opacity="0.2">
    <line x1="300" y1="165" x2="345" y2="155" stroke="#8B5CF6" stroke-dasharray="4 3"/>
    <line x1="455" y1="140" x2="500" y2="130" stroke="#2DD4BF" stroke-dasharray="4 3"/>
    <line x1="400" y1="190" x2="400" y2="258" stroke="#8B5CF6" stroke-dasharray="4 3"/>
  </g>
  <!-- Title -->
  <text x="400" y="340" text-anchor="middle" font-family="system-ui" font-weight="700" font-size="22" fill="white">Prisma ORM with PostgreSQL</text>
  <text x="400" y="368" text-anchor="middle" font-family="system-ui" font-weight="400" font-size="13" fill="#A78BFA">A Practical Guide to Type-Safe Database Operations</text>
</svg>
