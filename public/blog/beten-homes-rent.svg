<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1033"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- House/building -->
  <g transform="translate(400,170)" opacity="0.3">
    <polygon points="0,-70 80,-20 -80,-20" fill="url(#grad)" opacity="0.4"/>
    <rect x="-55" y="-20" width="110" height="80" rx="4" fill="url(#grad)" opacity="0.25"/>
    <rect x="-15" y="10" width="30" height="50" rx="2" fill="white" opacity="0.15"/>
    <rect x="-45" y="-10" width="22" height="18" rx="2" fill="white" opacity="0.1"/>
    <rect x="23" y="-10" width="22" height="18" rx="2" fill="white" opacity="0.1"/>
  </g>
  <!-- Platform icons around -->
  <g opacity="0.25">
    <!-- Desktop -->
    <rect x="120" y="140" width="60" height="45" rx="4" fill="#8B5CF6" opacity="0.3"/>
    <rect x="140" y="185" width="20" height="4" rx="2" fill="#8B5CF6" opacity="0.2"/>
    <rect x="130" y="189" width="40" height="3" rx="1.5" fill="#8B5CF6" opacity="0.15"/>
    <!-- Mobile -->
    <rect x="620" y="150" width="30" height="50" rx="6" fill="#2DD4BF" opacity="0.3"/>
    <rect x="625" y="158" width="20" height="30" rx="2" fill="white" opacity="0.1"/>
    <!-- Connection lines -->
    <line x1="180" y1="165" x2="345" y2="175" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
    <line x1="455" y1="175" x2="620" y2="170" stroke="#2DD4BF" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
  </g>
  <!-- Dollar signs / rent -->
  <g fill="#2DD4BF" opacity="0.15" font-family="system-ui" font-size="20" font-weight="bold">
    <text x="200" y="280">$</text>
    <text x="600" y="280">$</text>
    <text x="400" y="290">$</text>
  </g>
  <!-- Title -->
  <text x="400" y="350" text-anchor="middle" font-family="system-ui" font-weight="700" font-size="24" fill="white">Beten Homes Rent</text>
  <text x="400" y="378" text-anchor="middle" font-family="system-ui" font-weight="400" font-size="14" fill="#A78BFA">Multi-Platform Rental Management System</text>
</svg>
