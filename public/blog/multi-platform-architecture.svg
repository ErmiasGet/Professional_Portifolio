<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1033"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Central server/backend -->
  <g transform="translate(400,160)">
    <rect x="-40" y="-50" width="80" height="100" rx="8" fill="url(#grad)" opacity="0.3"/>
    <rect x="-30" y="-40" width="60" height="8" rx="4" fill="white" opacity="0.2"/>
    <rect x="-30" y="-25" width="40" height="6" rx="3" fill="white" opacity="0.15"/>
    <rect x="-30" y="-12" width="50" height="6" rx="3" fill="white" opacity="0.1"/>
    <circle cx="25" cy="-36" r="4" fill="#22C55E" opacity="0.4"/>
    <circle cx="25" cy="-22" r="4" fill="#22C55E" opacity="0.3"/>
    <circle cx="25" cy="-9" r="4" fill="#F59E0B" opacity="0.3"/>
  </g>
  <!-- Desktop client -->
  <g transform="translate(150,130)" opacity="0.35">
    <rect x="-50" y="-30" width="100" height="65" rx="6" fill="#1a1033" stroke="#8B5CF6" stroke-width="1.5"/>
    <rect x="-50" y="-30" width="100" height="12" rx="6" fill="#2A2A2E"/>
    <rect x="-40" y="-14" width="80" height="40" rx="2" fill="#8B5CF6" opacity="0.1"/>
    <rect x="-20" y="35" width="40" height="5" rx="2" fill="#8B5CF6" opacity="0.2"/>
    <text x="0" y="10" text-anchor="middle" font-family="system-ui" font-size="10" fill="#8B5CF6" opacity="0.6">Desktop</text>
  </g>
  <!-- Mobile client -->
  <g transform="translate(650,130)" opacity="0.35">
    <rect x="-25" y="-40" width="50" height="80" rx="8" fill="#1a1033" stroke="#2DD4BF" stroke-width="1.5"/>
    <rect x="-20" y="-30" width="40" height="55" rx="4" fill="#2DD4BF" opacity="0.1"/>
    <circle cx="0" cy="32" r="3" fill="#2DD4BF" opacity="0.3"/>
    <text x="0" y="-2" text-anchor="middle" font-family="system-ui" font-size="9" fill="#2DD4BF" opacity="0.6">Mobile</text>
  </g>
  <!-- Web client -->
  <g transform="translate(400,310)" opacity="0.3">
    <rect x="-70" y="-25" width="140" height="50" rx="6" fill="#1a1033" stroke="#8B5CF6" stroke-width="1.5"/>
    <rect x="-70" y="-25" width="140" height="10" rx="6" fill="#2A2A2E"/>
    <circle cx="-58" cy="-20" r="2.5" fill="#EF4444" opacity="0.4"/>
    <circle cx="-50" cy="-20" r="2.5" fill="#F59E0B" opacity="0.4"/>
    <circle cx="-42" cy="-20" r="2.5" fill="#22C55E" opacity="0.4"/>
    <text x="0" y="5" text-anchor="middle" font-family="system-ui" font-size="10" fill="#A78BFA" opacity="0.6">Web</text>
  </g>
  <!-- Connection lines -->
  <g stroke-width="1.5" stroke-dasharray="6 4" opacity="0.25">
    <line x1="200" y1="130" x2="360" y2="155" stroke="#8B5CF6"/>
    <line x1="440" y1="155" x2="600" y2="130" stroke="#2DD4BF"/>
    <line x1="400" y1="210" x2="400" y2="285" stroke="#8B5CF6"/>
  </g>
  <!-- Title -->
  <text x="400" y="385" text-anchor="middle" font-family="system-ui" font-weight="700" font-size="22" fill="white">Multi-Platform Architecture</text>
  <text x="400" y="410" text-anchor="middle" font-family="system-ui" font-weight="400" font-size="13" fill="#A78BFA">Desktop, Mobile &amp; Web from One Codebase</text>
</svg>
