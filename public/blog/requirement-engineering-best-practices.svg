<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1033"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Document/requirements -->
  <g transform="translate(400,140)" opacity="0.3">
    <rect x="-50" y="-50" width="100" height="130" rx="6" fill="#1a1033" stroke="url(#grad)" stroke-width="1.5"/>
    <rect x="-38" y="-38" width="60" height="5" rx="2" fill="#8B5CF6" opacity="0.4"/>
    <rect x="-38" y="-28" width="76" height="3" rx="1.5" fill="white" opacity="0.15"/>
    <rect x="-38" y="-20" width="65" height="3" rx="1.5" fill="white" opacity="0.12"/>
    <rect x="-38" y="-12" width="72" height="3" rx="1.5" fill="white" opacity="0.1"/>
    <line x1="-38" y1="-2" x2="38" y2="-2" stroke="white" stroke-width="0.5" opacity="0.1"/>
    <rect x="-38" y="5" width="50" height="5" rx="2" fill="#2DD4BF" opacity="0.3"/>
    <rect x="-38" y="15" width="76" height="3" rx="1.5" fill="white" opacity="0.12"/>
    <rect x="-38" y="23" width="60" height="3" rx="1.5" fill="white" opacity="0.1"/>
    <rect x="-38" y="31" width="70" height="3" rx="1.5" fill="white" opacity="0.08"/>
    <rect x="-38" y="41" width="45" height="5" rx="2" fill="#8B5CF6" opacity="0.25"/>
    <rect x="-38" y="51" width="76" height="3" rx="1.5" fill="white" opacity="0.1"/>
    <rect x="-38" y="59" width="55" height="3" rx="1.5" fill="white" opacity="0.08"/>
  </g>
  <!-- Checklist items floating -->
  <g opacity="0.25">
    <g transform="translate(160,120)">
      <rect x="-40" y="-12" width="80" height="24" rx="5" fill="#1a1033" stroke="#8B5CF6" stroke-width="0.8"/>
      <path d="M-28,-2 L-24,2 L-18,-4" stroke="#22C55E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <text x="-10" y="2" font-family="system-ui" font-size="8" fill="white" opacity="0.5">Functional</text>
    </g>
    <g transform="translate(160,165)">
      <rect x="-40" y="-12" width="80" height="24" rx="5" fill="#1a1033" stroke="#8B5CF6" stroke-width="0.8"/>
      <path d="M-28,-2 L-24,2 L-18,-4" stroke="#22C55E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <text x="-10" y="2" font-family="system-ui" font-size="8" fill="white" opacity="0.5">Non-Functional</text>
    </g>
    <g transform="translate(640,130)">
      <rect x="-40" y="-12" width="80" height="24" rx="5" fill="#1a1033" stroke="#2DD4BF" stroke-width="0.8"/>
      <path d="M-28,-2 L-24,2 L-18,-4" stroke="#22C55E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <text x="-10" y="2" font-family="system-ui" font-size="8" fill="white" opacity="0.5">User Stories</text>
    </g>
    <g transform="translate(640,175)">
      <rect x="-40" y="-12" width="80" height="24" rx="5" fill="#1a1033" stroke="#2DD4BF" stroke-width="0.8"/>
      <path d="M-28,-2 L-24,2 L-18,-4" stroke="#22C55E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <text x="-10" y="2" font-family="system-ui" font-size="8" fill="white" opacity="0.5">Use Cases</text>
    </g>
  </g>
  <!-- Flow arrows -->
  <g stroke-width="1" stroke-dasharray="4 3" opacity="0.15">
    <line x1="200" y1="140" x2="350" y2="145" stroke="#8B5CF6"/>
    <line x1="200" y1="165" x2="350" y2="160" stroke="#8B5CF6"/>
    <line x1="450" y1="145" x2="600" y2="130" stroke="#2DD4BF"/>
    <line x1="450" y1="160" x2="600" y2="175" stroke="#2DD4BF"/>
  </g>
  <!-- Agile cards -->
  <g transform="translate(400,290)" opacity="0.15">
    <rect x="-90" y="-12" width="50" height="24" rx="4" fill="#8B5CF6" opacity="0.4"/>
    <text x="-65" y="4" text-anchor="middle" font-family="system-ui" font-size="8" fill="white">Agile</text>
    <rect x="-30" y="-12" width="60" height="24" rx="4" fill="#2DD4BF" opacity="0.4"/>
    <text x="0" y="4" text-anchor="middle" font-family="system-ui" font-size="8" fill="white">Scrum</text>
    <rect x="40" y="-12" width="50" height="24" rx="4" fill="#8B5CF6" opacity="0.4"/>
    <text x="65" y="4" text-anchor="middle" font-family="system-ui" font-size="8" fill="white">Sprint</text>
  </g>
  <!-- Title -->
  <text x="400" y="350" text-anchor="middle" font-family="system-ui" font-weight="700" font-size="22" fill="white">Requirement Engineering</text>
  <text x="400" y="378" text-anchor="middle" font-family="system-ui" font-weight="400" font-size="13" fill="#A78BFA">Best Practices for Software Developers</text>
</svg>
