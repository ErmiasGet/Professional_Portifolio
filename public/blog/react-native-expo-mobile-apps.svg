<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1033"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Phone frame -->
  <g transform="translate(400,155)">
    <rect x="-45" y="-65" width="90" height="130" rx="14" fill="#1a1033" stroke="url(#grad)" stroke-width="2"/>
    <rect x="-38" y="-55" width="76" height="108" rx="4" fill="white" opacity="0.05"/>
    <!-- Notch -->
    <rect x="-15" y="-62" width="30" height="6" rx="3" fill="#2A2A2E"/>
    <!-- Screen content -->
    <rect x="-32" y="-45" width="64" height="30" rx="4" fill="#8B5CF6" opacity="0.15"/>
    <rect x="-32" y="-10" width="30" height="8" rx="2" fill="white" opacity="0.1"/>
    <rect x="-32" y="2" width="45" height="5" rx="2" fill="white" opacity="0.07"/>
    <rect x="-32" y="12" width="35" height="5" rx="2" fill="white" opacity="0.05"/>
    <!-- Bottom nav -->
    <rect x="-32" y="35" width="64" height="12" rx="3" fill="#2A2A2E" opacity="0.5"/>
    <circle cx="-18" cy="41" r="3" fill="#8B5CF6" opacity="0.4"/>
    <circle cx="0" cy="41" r="3" fill="white" opacity="0.15"/>
    <circle cx="18" cy="41" r="3" fill="white" opacity="0.15"/>
    <!-- Home indicator -->
    <rect x="-12" y="56" width="24" height="3" rx="1.5" fill="white" opacity="0.15"/>
  </g>
  <!-- Expo logo area -->
  <g transform="translate(400,155)" opacity="0.2">
    <circle cx="0" cy="-85" r="18" fill="#1a1033" stroke="#8B5CF6" stroke-width="1"/>
    <text x="0" y="-81" text-anchor="middle" font-family="system-ui" font-size="9" font-weight="bold" fill="#8B5CF6">Expo</text>
  </g>
  <!-- Cross-platform indicators -->
  <g opacity="0.25">
    <!-- iOS -->
    <g transform="translate(200,140)">
      <rect x="-30" y="-20" width="60" height="40" rx="8" fill="#1a1033" stroke="#8B5CF6" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="system-ui" font-size="10" fill="#8B5CF6">iOS</text>
    </g>
    <!-- Android -->
    <g transform="translate(600,140)">
      <rect x="-35" y="-20" width="70" height="40" rx="8" fill="#1a1033" stroke="#2DD4BF" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="system-ui" font-size="10" fill="#2DD4BF">Android</text>
    </g>
  </g>
  <!-- Connection lines -->
  <g stroke-width="1" stroke-dasharray="4 3" opacity="0.2">
    <line x1="230" y1="140" x2="355" y2="150" stroke="#8B5CF6"/>
    <line x1="445" y1="150" x2="565" y2="140" stroke="#2DD4BF"/>
  </g>
  <!-- Code snippet -->
  <g transform="translate(400,290)" opacity="0.2">
    <rect x="-100" y="-15" width="200" height="30" rx="6" fill="#1a1033" stroke="#8B5CF6" stroke-width="0.5"/>
    <text x="-85" y="5" font-family="monospace" font-size="10" fill="#8B5CF6">npx create-expo-app</text>
  </g>
  <!-- Title -->
  <text x="400" y="355" text-anchor="middle" font-family="system-ui" font-weight="700" font-size="22" fill="white">React Native &amp; Expo</text>
  <text x="400" y="383" text-anchor="middle" font-family="system-ui" font-weight="400" font-size="13" fill="#A78BFA">Building Cross-Platform Mobile Apps</text>
</svg>
